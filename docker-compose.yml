name: rycode

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rycode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rycode_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-rycode}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  storage-init:
    image: alpine:3.22
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /storage/private
        chown 1001:1001 /storage/private
        chmod 0750 /storage/private
    volumes:
      - private_storage:/storage/private
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rycode}:${POSTGRES_PASSWORD:-rycode_dev_only}@postgres:5432/${POSTGRES_DB:-rycode}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-rycode}:${POSTGRES_PASSWORD:-rycode_dev_only}@postgres:5432/${POSTGRES_DB:-rycode}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in the deployment environment}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      AUTH_EMAIL_MODE: ${AUTH_EMAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in the deployment environment}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in the deployment environment}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PRIVATE_STORAGE_ROOT: /app/storage/private
    volumes:
      - private_storage:/app/storage/private
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      RYCODE_DOMAIN: ${RYCODE_DOMAIN:-rycode.ir}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

volumes:
  postgres_data:
    name: rycode_postgres_data
  private_storage:
    name: rycode_private_storage
  clamav_data:
    name: rycode_clamav_data
  caddy_data:
    name: rycode_caddy_data
  caddy_config:
    name: rycode_caddy_config

networks:
  backend:
    internal: true
  edge:
